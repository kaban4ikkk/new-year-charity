<style>
    /* Сбрасываем отступы, чтобы рамка не ездила */
    body { margin: 0; padding: 0; font-family: sans-serif; background: transparent; }
    
    .timer-box {
        background: #FFFFFF;
        padding: 10px 15px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(230,57,70,0.1);
        border: 1px solid #FFD4CC;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
    }
    .timer-label {
        font-size: 0.7rem;
        color: #E63946;
        font-weight: bold;
        margin-bottom: 4px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .timer-value {
        font-size: 1.2rem;
        font-weight: bold;
        color: #2C3E50;
    }
</style>

<div class="timer-box">
    <div class="timer-label">До Нового года осталось:</div>
    <div id="ny-timer" class="timer-value">Загрузка...</div>
</div>

<script>
    const currentYear = new Date().getFullYear();
    const targetDate = new Date(currentYear + 1, 0, 1, 0, 0, 0).getTime();
    const timerElement = document.getElementById("ny-timer");
    
    const updateTimer = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate - now;
        
        if (distance < 0) {
            clearInterval(updateTimer);
            timerElement.innerHTML = "🎉 С Новым Годом! 🎉";
            return;
        }
        
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        timerElement.innerHTML = days + "д " + hours + "ч " + minutes + "м " + seconds + "с";
    }, 1000);
</script>
