<div class="header-container">
    <div>
        <h1 class="header-title">🎁 Новогодняя акция: Подари мечту</h1>
        <p class="header-subtitle">Выберите письмо ребёнка и помогите исполнить его мечту ✨</p>
    </div>

    <div class="timer-box">
        <div class="timer-label">До Нового года осталось:</div>
        <div id="ny-timer" class="timer-value">Загрузка...</div>
    </div>
</div>

<script>
    const currentYear = new Date().getFullYear();
    const targetDate = new Date(currentYear + 1, 0, 1, 0, 0, 0).getTime();
    const timerElement = document.getElementById("ny-timer");
    
    const updateTimer = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate - now;
        
        if (distance < 0) {
            clearInterval(updateTimer);
            timerElement.innerHTML = "🎉 С Новым Годом! 🎉";
            return;
        }
        
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        timerElement.innerHTML = days + "д " + hours + "ч " + minutes + "м " + seconds + "с";
    }, 1000);
</script>
